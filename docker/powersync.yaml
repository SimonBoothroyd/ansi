    #   data:
    #     - select * from ingredient        where household_id = bucket.household_id
    #     - select * from ingredient_alias  where household_id = bucket.household_id
    #     - select * from recipe            where household_id = bucket.household_id
    #     # NOTE: usda_food is NEVER listed here — server-side only (ADR-0005).
    {}
