# PowerSync sync rules — decide which rows reach which client.
# These MUST mirror the RLS boundaries (docs/SECURITY.md): a device only ever
# syncs its own household's data, and never server-only tables (usda_food).
#
# STUB — bucket definitions are added as domain tables land (roadmap step 7).
# The pattern (household-scoped): parameter the household_id from the JWT, then
# select each synced table where household_id = the token's household.

replication:
  # Configured against the local Supabase Postgres; see docker/compose.yaml.
  connections: []

sync_rules:
  bucket_definitions:
    # household:
