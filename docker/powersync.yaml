# PowerSync service config — decides which rows reach which client, and how the
# service connects to Postgres and verifies client tokens.
#
# The sync rules MUST mirror the RLS boundaries (docs/SECURITY.md): a device only
# ever syncs its own household's data, and never server-only tables (usda_food,
# ADR-0005). The household is resolved from the JWT `household_id` claim that the
# `add_household_claim` access-token hook injects (migration 0007).
#
# Env comes from docker/compose.yaml (which reads .env.local):
#   PS_PG_HOST/PORT/DATABASE/USER/PASSWORD — the Postgres the service
#     replicates from + stores buckets in (discrete fields, see below)
#   PS_JWKS_URI — Supabase's JWKS endpoint; client tokens are asymmetric
#     (ES256) and verified against those public keys (see client_auth)

replication:
  connections:
    - type: postgresql
      # Discrete fields (not a URI): jpgwire only honours `sslmode` here, so the
      # local Supabase Postgres — plain TCP, no TLS — connects without an SSL
      # negotiation. Values come from .env.local via docker/compose.yaml.
      hostname: !env PS_PG_HOST
      port: !env PS_PG_PORT
      database: !env PS_PG_DATABASE
      username: !env PS_PG_USER
      password: !env PS_PG_PASSWORD
      sslmode: disable

# Bucket storage. Self-hosted PowerSync needs somewhere to keep the compiled
# bucket state; reuse the same Postgres (its own schema) so local dev stays a
# single database — no extra MongoDB container.
storage:
  type: postgresql
  hostname: !env PS_PG_HOST
  port: !env PS_PG_PORT
  database: !env PS_PG_DATABASE
  username: !env PS_PG_USER
  password: !env PS_PG_PASSWORD
  sslmode: disable

port: 8080

# Verify client tokens against Supabase's JWKS. Supabase local (and cloud) now
# issue ASYMMETRIC (ES256) access tokens, so the service fetches the public keys
# from Supabase's JWKS endpoint rather than sharing an HS256 secret. Only tokens
# whose audience is `authenticated` (a signed-in user) are accepted.
client_auth:
  jwks_uri: !env PS_JWKS_URI
  audience:
    - authenticated

# Sync rules are supplied inline (`content`); a `path:` to a separate file works
# too. One bucket per household: `household_id` is parametered from the JWT claim
# the token hook injects, and every synced table is filtered to that household.
# Mirrors the RLS boundaries in migrations 0001–0008. usda_food is NEVER listed —
# server-only (ADR-0005). household_member uses an explicit column list: what a
# rule SELECTs is exactly what ships to the device as row JSON (the client
# schema is a view over it, not a filter), so auth_user_id — server-only, the
# client never needs it — must be excluded here, not just omitted client-side.
# Template households (0008: is_template, member-less) never appear in any
# bucket: the claim below is only ever a household the user is a member of.
sync_rules:
  content: |
    bucket_definitions:
      household:
        parameters: select request.jwt() ->> 'household_id' as household_id
        data:
          - select * from household         where id = bucket.household_id
          - select id, household_id, display_name, sort_order, portion_factor, created_at, updated_at, deleted_at from household_member where household_id = bucket.household_id
          - select * from ingredient        where household_id = bucket.household_id
          - select * from ingredient_alias  where household_id = bucket.household_id
          - select * from ingredient_measure where household_id = bucket.household_id
          - select * from book              where household_id = bucket.household_id
          - select * from book_section      where household_id = bucket.household_id
          - select * from recipe            where household_id = bucket.household_id
          - select * from ingredient_group  where household_id = bucket.household_id
          - select * from recipe_line_item  where household_id = bucket.household_id
          - select * from week_plan         where household_id = bucket.household_id
          - select * from plan_entry        where household_id = bucket.household_id
          - select * from week_recipe_line_override where household_id = bucket.household_id
          - select * from shopping_list_entry        where household_id = bucket.household_id
          - select * from shopping_list_contribution where household_id = bucket.household_id
          - select * from receipt                    where household_id = bucket.household_id
          - select * from receipt_line               where household_id = bucket.household_id
