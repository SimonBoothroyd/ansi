# Local PowerSync service for development. Mirrors the layout of the
# powersync-community/flutter-powersync-supabase starter. Reads .env.local.
services:
  powersync:
    image: journeyapps/powersync-service:latest
    container_name: mise-powersync
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./powersync.yaml:/config/powersync.yaml:ro
    command: ["start", "-r", "unified", "-c", "/config/powersync.yaml"]
    environment:
      # Discrete Postgres connection fields for the local Supabase DB. From
      # inside the container that host is `host.docker.internal`, not 127.0.0.1.
      # jpgwire honours `sslmode: disable` (powersync.yaml) only via these fields,
      # not a URI query param — hence the split. Values from .env.local.
      PS_PG_HOST: ${POWERSYNC_PG_HOST:-host.docker.internal}
      PS_PG_PORT: ${POWERSYNC_PG_PORT:-54322}
      PS_PG_DATABASE: ${POWERSYNC_PG_DATABASE:-postgres}
      PS_PG_USER: ${POWERSYNC_PG_USER:-postgres}
      PS_PG_PASSWORD: ${POWERSYNC_PG_PASSWORD:-postgres}
      # Supabase's JWKS endpoint — PowerSync fetches the ES256 public keys here
      # to verify client tokens. host.docker.internal = the Mac from the container.
      PS_JWKS_URI: ${POWERSYNC_JWKS_URI:-http://host.docker.internal:54321/auth/v1/.well-known/jwks.json}
    extra_hosts:
      - "host.docker.internal:host-gateway"
