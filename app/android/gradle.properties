org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# The Flutter plugin otherwise resets defaultConfig's abiFilters to
# armeabi-v7a/arm64-v8a/x86_64, which AGP unions with the release build
# type's arm64-only filter (app/build.gradle.kts). Also means
# `flutter build apk --split-per-abi` is unsupported: AGP refuses splits
# beside abiFilters.
disable-abi-filtering=true
