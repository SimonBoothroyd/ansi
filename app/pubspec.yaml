name: mise
description: A shared, offline-first recipe and meal-planning app for two.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  # UI — shadcn-style widgets (requires Flutter 3.44+) + Lucide icons
  forui: ^0.22.0
  forui_hooks: ^0.22.0
  flutter_hooks: ^0.21.0

  # State + DI + navigation (ADR-0003)
  hooks_riverpod: ^3.0.0
  riverpod_annotation: ^3.0.0
  go_router: ^16.0.0

  # Models
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  uuid: ^4.5.0            # client-side ids for locally-created rows

  # Backend + offline sync (ADR-0002)
  supabase_flutter: ^2.8.0
  powersync: ^1.9.0
  sqlite_async: ^0.13.0   # the SqliteConnection query surface repos depend on
  sqlite3: ^2.9.0         # Row/ResultSet types from query results

  # Utilities
  path_provider: ^2.1.0   # on-device location for the local PowerSync SQLite
  shared_preferences: ^2.5.0  # cached household id for offline relaunch (session.dart)
  path: ^1.9.0
  collection: ^1.19.0
  meta: ^1.16.0            # @immutable etc. (used in core/result)
  # fl_chart: ^0.69.0   # stretch: macro charts (spec §7 step 9)

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Lints — strict ruleset + Riverpod-aware lints.
  # riverpod_lint is capped below 3.1.0: 3.1.x moved its plugin entrypoint and
  # needs a newer custom_lint than the 0.8.x that riverpod_generator 3.0 pins,
  # so the whole custom_lint stack stays on the coherent 3.0.x / 0.8.x generation.
  very_good_analysis: ^7.0.0
  custom_lint: ^0.8.1
  riverpod_lint: ">=3.0.0 <3.1.0"

  # Codegen
  build_runner: ^2.4.0
  riverpod_generator: ^3.0.0
  freezed: ^3.0.0
  json_serializable: ^6.9.0

  # Test helpers
  mocktail: ^1.0.0

flutter:
  uses-material-design: true

  # Bundled (offline) fonts for the three design-board type roles. OFL 1.1;
  # see assets/fonts/OFL.txt. Wired into core/theme/mise_theme.dart.
  fonts:
    - family: Spectral        # serif — titles, group headers
      fonts:
        - asset: assets/fonts/Spectral-Regular.ttf
        - asset: assets/fonts/Spectral-Italic.ttf
          style: italic
        - asset: assets/fonts/Spectral-Medium.ttf
          weight: 500
        - asset: assets/fonts/Spectral-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Spectral-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Spectral-Bold.ttf
          weight: 700
    - family: IBM Plex Mono   # data — quantities, units, mono-caps labels
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
    # Inter (interface text) is NOT bundled here — Forui already ships it as
    # `packages/forui/Inter`, which mise_theme's sans stack points at.

# NOTE: version constraints use caret ranges with recent floors. Run
# `flutter pub get` then `flutter pub outdated` on first checkout and let the
# resolver pick concrete versions; bump floors here if a resolve conflict shows.
