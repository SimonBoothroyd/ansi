<!DOCTYPE html>
<html>
<head>
  <!--
    The base path the app is served from. `flutter build web --base-href` fills
    this in: "/" for a user site or a local `python3 -m http.server`, "/ansi/"
    for the GitHub Pages project site (.github/workflows/release.yml). It must
    start and end with a slash.

    The router stays on HASH urls (.../#/week) because Pages serves static
    files and cannot rewrite a deep link back to index.html — a path url would
    404 on every refresh and on every link anyone shares. See docs/release.md.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Plan the week you want to eat. Ansi derives what to cook in batches and buys each thing once.">
  <!-- The paper the app is painted on, so the browser's own chrome and the
       first frame are not a flash of white (AnsiColors.paper / .herb). -->
  <meta name="theme-color" content="#2C6A3A">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Ansi">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Ansi</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* The paper ground, before Flutter has painted anything. */
    body { background-color: #F4F6F1; margin: 0; }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
