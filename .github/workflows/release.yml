name: release

# Cut a release by pushing a tag:  git tag v0.1.0 && git push origin v0.1.0
# Full setup (secrets, keystore, what lands where): docs/release.md
#
# workflow_dispatch is here so the guard + both builds can be rehearsed without
# minting a tag; the GitHub Release upload is the only tag-only step.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Pinned to match app.yml — the SDK everything is verified against.
  FLUTTER_VERSION: "3.47.1" # exact — matches app.yml and local

jobs:
  # ---------------------------------------------------------------------------
  # Fail in ~15s with an actionable list, rather than 8 minutes later inside
  # Gradle. Two classes of failure are checked, both of which otherwise produce
  # a build that *succeeds* and ships the wrong thing:
  #
  #   1. Missing signing secrets → Gradle's `key.properties` fallback silently
  #      debug-signs the release (app/android/app/build.gradle.kts). Installable,
  #      but a different signature, so it can never update a real install.
  #   2. Missing app config secrets → Env.isConfigured is false and the app
  #      builds in local/dev mode (app/lib/core/config/env.dart), pointing at
  #      nothing. (They are secrets, not variables, so the masked log never
  #      prints the household's own endpoints — the repo is public.)
  # ---------------------------------------------------------------------------
  guard:
    name: guard (secrets + signing block)
    runs-on: ubuntu-latest
    outputs:
      # Consumed by the play-internal job's `if`. A job-level `if` cannot read
      # the `secrets` context at all, so "is Play configured?" has to be
      # answered here and passed down as a plain string output.
      play_configured: ${{ steps.play.outputs.configured }}
    steps:
      - uses: actions/checkout@v4

      - name: Release signing block is committed
        run: |
          if ! grep -q 'key.properties' app/android/app/build.gradle.kts; then
            echo "::error::app/android/app/build.gradle.kts has no key.properties signing block."
            echo "This pipeline signs by writing android/key.properties; without the Gradle"
            echo "block that reads it, a 'release' build is silently DEBUG-signed and cannot"
            echo "update a real install. Commit the signing block first (docs/release.md §1)."
            exit 1
          fi
          echo "✓ signing block present"

      - name: Signing secrets + app config are configured
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          POWERSYNC_URL: ${{ secrets.POWERSYNC_URL }}
        run: |
          missing=()
          for s in ANDROID_KEYSTORE_B64 ANDROID_KEYSTORE_PASSWORD \
                   ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!s}" ] || missing+=("  gh secret set $s")
          done
          for v in SUPABASE_URL SUPABASE_ANON_KEY POWERSYNC_URL; do
            [ -n "${!v}" ] || missing+=("  gh secret set $v")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::release is not configured — ${#missing[@]} item(s) missing."
            echo "Configure exactly these, then re-run (see docs/release.md §2):"
            printf '%s\n' "${missing[@]}"
            exit 1
          fi
          echo "✓ 4 signing secrets + 3 config secrets present"

      # Play distribution is ADDITIVE: it is a second delivery channel layered
      # on top of the GitHub Release, not a replacement for it. So an absent
      # service-account key is a *notice*, never a failure — the tag still
      # produces a signed APK + AAB on the Release. Only the phone-auto-update
      # leg goes missing, and the notice says exactly how to turn it on.
      - name: Play publishing configured? (advisory, never fatal)
        id: play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "✓ PLAY_SERVICE_ACCOUNT_JSON present — the AAB will go to the internal track"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Play upload SKIPPED — PLAY_SERVICE_ACCOUNT_JSON is not set."
            echo "The GitHub Release still gets the signed APK + AAB; only the"
            echo "internal-track auto-update to the Pixel is skipped. To enable it,"
            echo "walk docs/release.md §3a (one-time Play Console setup) and finish with:"
            echo "  gh secret set PLAY_SERVICE_ACCOUNT_JSON < play-service-account.json"
          fi

  # ---------------------------------------------------------------------------
  # Android: the shippable artifacts. APK for sideloading onto our own phones,
  # AAB because it is what Play's internal track takes.
  # ---------------------------------------------------------------------------
  android:
    name: android (apk + aab → release)
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the Release and upload assets to it
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      # Gradle config sets source/target + jvmTarget to 17; pin the JDK rather
      # than inheriting whatever the runner image defaults to this month.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle # the single biggest release-build cost when cold

      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('app/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs

      # The keystore never touches the workspace: RUNNER_TEMP is outside the
      # checkout, so it cannot be picked up by a glob or left in an artifact.
      # storeFile is written ABSOLUTE on purpose — Gradle resolves a relative
      # storeFile against android/app/, not android/, which is a silent
      # "keystore not found" if you guess wrong.
      - name: Decode keystore and write android/key.properties
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          keystore="$RUNNER_TEMP/upload-keystore.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$keystore"
          [ -s "$keystore" ] || {
            echo "::error::ANDROID_KEYSTORE_B64 decoded to an empty file — re-run the base64 step in docs/release.md §2"
            exit 1
          }
          {
            printf 'storeFile=%s\n'     "$keystore"
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n'      "$KEY_ALIAS"
            printf 'keyPassword=%s\n'   "$KEY_PASSWORD"
          } > android/key.properties
          echo "✓ key.properties written (4 keys, keystore $(wc -c < "$keystore") bytes)"

      # Same three defines `make run` passes. They are repo VARIABLES, not
      # secrets: all three are public by design (the Supabase publishable key is
      # the anon key — RLS is the real protection, see docs/SECURITY.md), and a
      # variable is readable in logs, which is what you want when debugging a
      # build that shipped pointing at the wrong project.
      # --- versionCode: CI owns it, and the rule is one line -------------------
      # Play permanently rejects a versionCode it has already seen, so the
      # number must strictly increase forever. pubspec's `version: 0.1.0+1`
      # can't do that: `flutter.versionCode` reads the `+N`, which is a
      # hand-edited constant that nobody remembers to bump and that resets to
      # whatever a branch happens to carry.
      #
      # RULE: versionCode = github.run_number of THIS workflow. It increments
      # on every run, never repeats, and never goes backwards.
      #
      # The two things that rule implies, both documented in docs/release.md §3c:
      #   * Never upload a locally built AAB to Play. A local `flutter build
      #     appbundle` uses pubspec's `+N` (today: 1) and would burn a low
      #     versionCode that CI then has to climb past. The first, manual
      #     upload therefore uses the CI ARTIFACT, not a laptop build.
      #   * Never rename this workflow file. run_number is per-file and would
      #     restart at 1, and every subsequent upload would be rejected.
      #
      # versionName is cosmetic (Play shows it) so it tracks the tag: v0.1.0 →
      # 0.1.0. On a dispatch rehearsal there is no tag, so pubspec's stands.
      - name: Derive version
        id: version
        run: |
          code="${GITHUB_RUN_NUMBER}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            name="${GITHUB_REF_NAME#v}"
          else
            name="$(grep -m1 '^version:' pubspec.yaml | sed 's/^version: *//; s/+.*//')"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "versionName=$name  versionCode=$code"

      - name: Build APK + AAB (release, signed)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          POWERSYNC_URL: ${{ secrets.POWERSYNC_URL }}
          BUILD_NAME: ${{ steps.version.outputs.name }}
          BUILD_NUMBER: ${{ steps.version.outputs.code }}
        run: |
          args=(
            --release
            --build-name="$BUILD_NAME"
            --build-number="$BUILD_NUMBER"
            "--dart-define=SUPABASE_URL=$SUPABASE_URL"
            "--dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
            "--dart-define=POWERSYNC_URL=$POWERSYNC_URL"
          )
          # The APK is what the phones install, and the phones are Pixels:
          # arm64 only. --target-platform alone trims Flutter's own libraries
          # but the plugins' native code (barcode, SQLite, PowerSync) still
          # ships for every ABI; --split-per-abi filters those too, and with
          # one target platform it yields exactly one APK. A fat APK was
          # 94 MB. The AAB keeps every ABI — that is what a bundle is for.
          flutter build apk "${args[@]}" --target-platform android-arm64 --split-per-abi
          flutter build appbundle "${args[@]}"

      - name: Name the artifacts for the tag
        id: stage
        run: |
          # Slugified: a workflow_dispatch rehearsal from a branch like
          # feat/step-8 would otherwise put a "/" in the filename.
          slug="${GITHUB_REF_NAME//\//-}"
          mkdir -p "$RUNNER_TEMP/dist"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             "$RUNNER_TEMP/dist/ansi-$slug.apk"
          cp build/app/outputs/bundle/release/app-release.aab \
             "$RUNNER_TEMP/dist/ansi-$slug.aab"
          ls -l "$RUNNER_TEMP/dist"
          echo "dist=$RUNNER_TEMP/dist" >> "$GITHUB_OUTPUT"

      # Always keep the build products, even on a workflow_dispatch rehearsal
      # where there is no tag to attach a Release to.
      # Artifact names are ref-free: upload-artifact rejects "/" in a name, and
      # a dispatch from a branch like feat/x would otherwise fail here. The tag
      # is in the FILE names (ansi-v0.1.0.apk).
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: ${{ steps.stage.outputs.dist }}
          if-no-files-found: error

      # `gh` ships on the runner, so no third-party release action to audit.
      # Re-runnable: uploads with --clobber if the Release already exists.
      - name: Publish to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIST: ${{ steps.stage.outputs.dist }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$DIST"/* --clobber
          else
            gh release create "$tag" "$DIST"/* --title "$tag" --generate-notes
          fi

  # ---------------------------------------------------------------------------
  # Play internal track — the CD leg. Tag push → AAB on the internal track →
  # the Pixel updates itself from Play. No sideloading.
  #
  # A SEPARATE job, not extra steps on `android`, for three reasons: a
  # job-level `if` is the only way to skip the Play leg *wholesale* when the
  # secret is absent (see guard.outputs.play_configured); a Play API hiccup
  # then shows as its own red job instead of retroactively failing a build
  # whose artifacts are fine and already on the Release; and re-running just
  # this job after fixing Play Console permissions doesn't rebuild the app.
  #
  # ACTION CHOICE — r0adkll/upload-google-play over fastlane supply.
  # fastlane means a Ruby toolchain, a Gemfile, an Appfile/Fastfile, and a
  # lane to maintain: a whole second build system living in the repo to do one
  # HTTP upload. This action is a thin wrapper over the official Play Developer
  # API and adds no files here at all — which is the "boring, legible
  # dependencies" rule in AGENTS.md. Health-checked before adopting (2026-09):
  # not archived, ~1k stars, and the Node-20 EOL that would have broken it in
  # June 2026 was resolved — action.yml is on `using: node24`.
  # It is the one third-party action here that touches a publishing
  # credential; the hardening step, if that ever matters, is pinning `@v1` to a
  # commit SHA. The key it sees is scoped to Release Manager on this one app.
  # ---------------------------------------------------------------------------
  play-internal:
    name: play internal track
    needs: [guard, android]
    # Skipped, not failed, when Play isn't configured — the guard emitted a
    # notice saying so. Tag-only: there is no sensible Play release for a
    # workflow_dispatch rehearsal.
    if: >-
      needs.guard.outputs.play_configured == 'true' &&
      startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      # Reuse the exact binary the Release got — never rebuild for Play, or the
      # two channels could diverge from the same tag.
      - uses: actions/download-artifact@v4
        with:
          name: android-release
          path: dist

      - name: Upload AAB to the internal track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          # Must equal the Gradle applicationId. Play binds a package name to
          # its signing identity permanently; a mismatch here is a new app.
          packageName: io.ansi.app
          releaseFiles: dist/*.aab
          # `tracks`/`releaseFiles` are the current plural inputs — the singular
          # `track`/`releaseFile` still work but are deprecated upstream.
          tracks: internal
          # completed = live to internal testers immediately (vs `draft`, which
          # would need a console click every release).
          status: completed
          releaseName: ${{ github.ref_name }}

      - name: Summary
        run: |
          {
            echo "### Pushed to Play — internal track"
            echo
            echo "\`io.ansi.app\` · release **${GITHUB_REF_NAME}** · versionCode **${GITHUB_RUN_NUMBER}**"
            echo
            echo "Internal-track releases are available to testers in minutes"
            echo "(usually no review). The Pixel updates via Play once the"
            echo "tester account has opted in through the invite link — that"
            echo "opt-in is one-time, see docs/release.md §3a step 5."
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Web: the browser build, and the hosted copy of it.
  #
  # Same trigger and the same three defines as android, so what a browser runs
  # is the configuration a phone runs. Two things about it are worth knowing
  # before reading the steps:
  #
  #   1. `--base-href` must match where Pages serves the app. This is a PROJECT
  #      site (github.com/<owner>/<repo> → <owner>.github.io/<repo>/), so the
  #      repo name is part of every asset URL; with the default "/" the page
  #      loads and every asset 404s. It is derived from GITHUB_REPOSITORY
  #      rather than typed, so a rename cannot leave it stale.
  #   2. The bundle is a PUBLIC copy of the three defines. `main.dart.js` has
  #      them compiled in and anyone can read them — the anon key is public by
  #      design (RLS is the protection, docs/SECURITY.md) but the Supabase and
  #      PowerSync endpoints stop being private the moment this is hosted.
  #      That is the trade the owner accepts by turning Pages on, and it is
  #      written up in docs/release.md §6.
  #
  # The deploy is a separate job, gated on Pages actually being configured:
  # `actions/deploy-pages` fails outright against a repo with Pages off, and a
  # red release job for a host nobody has set up yet would be a lie about the
  # build. Build → artifact always; publish only when there is somewhere to
  # publish to.
  # ---------------------------------------------------------------------------
  web:
    name: web (browser build)
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read # only to ASK whether Pages is configured (the step below)
    outputs:
      pages_configured: ${{ steps.pages.outputs.configured }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('app/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs

      - name: Derive the Pages base href
        id: href
        run: |
          base="/${GITHUB_REPOSITORY#*/}/"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "base href: $base"

      # The committed PowerSync workers + sqlite3.wasm in app/web are copied in
      # by this build; app/test/structure/web_workers_match_powersync_test.dart
      # is what stops a stale pair shipping.
      - name: Build web (release)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          POWERSYNC_URL: ${{ secrets.POWERSYNC_URL }}
          BASE_HREF: ${{ steps.href.outputs.base }}
        run: |
          flutter build web --release \
            --base-href "$BASE_HREF" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=POWERSYNC_URL="$POWERSYNC_URL"
          du -sh build/web
          ls -l build/web

      - uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: app/build/web
          if-no-files-found: error

      # The Pages-shaped copy of the same directory. Uploading it is harmless
      # when Pages is off — it is just another artifact — and it has to happen
      # in THIS job, because deploy-pages consumes an artifact from the run.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web

      # Is there a host? `GET /repos/{owner}/{repo}/pages` answers 404 until
      # somebody enables Pages with source "GitHub Actions" (docs/release.md
      # §6). Advisory, never fatal — the build above already proved itself.
      - name: Pages configured? (advisory, never fatal)
        id: pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" >/dev/null 2>&1; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "✓ Pages is configured — the build will be deployed"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Pages deploy SKIPPED — this repo has no GitHub Pages site."
            echo "The web build is attached to this run as the 'web-release' artifact."
            echo "To host it: Settings → Pages → Source: GitHub Actions (once), then"
            echo "re-run this workflow. Read docs/release.md §6 FIRST — hosting the"
            echo "build publishes the Supabase and PowerSync endpoints it is compiled"
            echo "with, and the OAuth origins have to be added to Supabase or Google"
            echo "sign-in dead-ends in the browser (docs/cloud-setup.md §1.6)."
          fi

  # ---------------------------------------------------------------------------
  # The hosted copy. Tag-only, like the Release: a workflow_dispatch rehearsal
  # from a branch must not become the live site, and Pages has only one.
  # ---------------------------------------------------------------------------
  pages:
    name: github pages (deploy)
    needs: web
    if: >-
      needs.web.outputs.pages_configured == 'true' &&
      startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      pages: write # create the deployment
      id-token: write # deploy-pages authenticates with an OIDC token
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # Two tags landing together must not race each other onto one site.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Summary
        run: |
          {
            echo "### Hosted"
            echo
            echo "**${{ steps.deploy.outputs.page_url }}** · release **${GITHUB_REF_NAME}**"
            echo
            echo "Cross-origin isolation (COOP/COEP) is NOT set and is not needed:"
            echo "PowerSync's web build opens, writes and persists without it."
            echo "The router is on hash URLs because Pages cannot rewrite a deep"
            echo "link — see docs/release.md §6."
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # iOS: COMPILE PROOF ONLY, deliberately.
  #
  # Ansi is a two-person household app installed from Xcode, not from the App
  # Store. Real iOS signing would mean an Apple Developer account, a
  # distribution certificate and provisioning profile in secrets, a temporary
  # keychain, and an export-options plist — a lot of moving, expiring
  # machinery to produce an .ipa nobody installs. So this job proves the
  # release configuration still compiles and stops there. The .app is an
  # ARTIFACT, not a Release asset: it is unsigned and cannot be installed.
  #
  # It does not `need: guard` on purpose — the guard is about Android signing
  # and app config, and losing the compile signal when a secret expires would
  # be strictly worse.
  # ---------------------------------------------------------------------------
  ios:
    name: ios (compile proof, unsigned)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs

      # Same defines as the Android job so this compiles the real configuration.
      # If the variables are unset the defines are all blank, which Env treats
      # as legitimate local/dev mode — the compile proof still holds.
      - name: Build iOS (release, no codesign)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          POWERSYNC_URL: ${{ secrets.POWERSYNC_URL }}
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=POWERSYNC_URL="$POWERSYNC_URL"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-${{ github.ref_name }}
          path: app/build/ios/iphoneos/Runner.app
          if-no-files-found: error
