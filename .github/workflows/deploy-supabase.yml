name: deploy-supabase

# Push migrations + the import edge function to Supabase Cloud, then deploy
# the PowerSync sync streams to the cloud instance.
#
# MANUAL ONLY, by design. This repo's posture (docs/cloud-setup.md,
# supabase/AGENTS.md) is that touching cloud is a deliberate human act: a
# migration is immutable once applied there, and a bad `db push` is not a
# revert away. So CI's job here is to make that act ONE BUTTON with the right
# order and the right credentials — not to make it automatic on merge.
#
# Run it: Actions → deploy-supabase → Run workflow. Setup: docs/release.md §4.
#
# The sync-streams leg exists because of a real outage (2026-09-01): the cloud
# DB was rebuilt, the streams were never re-pasted into the dashboard, and every
# device silently synced a table list frozen at step 7.5 — `ingredient_measure`
# never reached a single phone, and nothing in CI or cloud_verify could see it.
# The PowerSync CLI deploys the committed YAML, so the streams now ride the
# same button as the schema they must match.
#
# NOT in this pipeline, on purpose:
#   * The household rollout (cloud-setup §2b) — it mutates live household
#     data and stays human-run. The TEMPLATE reseed (§2) graduated onto this
#     button on 2026-09-03 behind the `reseed_template` input: the template is
#     member-less, no device writes to it, and 0020 made the seed re-runnable.
#   * Function secrets — ANTHROPIC_API_KEY and IMPORT_ALLOWED_HOUSEHOLDS are
#     managed with `supabase secrets set` (cloud-setup §3b), never from here.
#     Values live only in the Supabase project; CI has no business holding them.
#   * Dashboard-only settings (auth hook, JWT audience, public sign-up) — see
#     the checklist in cloud-setup.md. (Sync streams graduated out of that
#     list: the CLI deploys them here.)
on:
  workflow_dispatch:
    inputs:
      reseed_template:
        description: >-
          Also reseed the TEMPLATE vocabulary (seed_vocab.sql → seed_usda
          (only if the reference table is empty) → seed_usda_index). This is
          the promote-to-template leg of the cloud → seed direction. Touches
          the member-less template household only; re-runnable since 0020.
          Existing households still need the §2b rollout by hand.
        type: boolean
        default: false

concurrency:
  group: deploy-supabase # never two pushes at the same project at once
  cancel-in-progress: false

jobs:
  deploy:
    name: link → db push → functions deploy
    runs-on: ubuntu-latest
    env:
      # The CLI reads the PAT from the environment; --project-ref names the
      # target so nothing depends on a linked state carried between steps.
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      # PowerSync CLI auth + target (docs/release.md §4.1). The token is a
      # PowerSync personal access token (dashboard → account → tokens); the
      # instance id is the leading segment of CLOUD_POWERSYNC_URL in cloud.env.
      PS_ADMIN_TOKEN: ${{ secrets.POWERSYNC_ADMIN_TOKEN }}
      POWERSYNC_INSTANCE_ID: ${{ secrets.POWERSYNC_INSTANCE_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          # Pinned, not `latest`, and to the same version backend.yml pins: the
          # CLI decides how migrations and seeds are applied, and this is the
          # job that touches production — a float here means the deploy can use
          # a CLI no test run ever exercised.
          version: 2.115.0

      # Same early-guard idea as release.yml: name what is missing before the
      # CLI fails with a generic auth error two steps later.
      - name: Guard — deploy credentials are configured
        run: |
          missing=()
          [ -n "$SUPABASE_ACCESS_TOKEN" ]  || missing+=("  gh secret set SUPABASE_ACCESS_TOKEN")
          [ -n "$SUPABASE_DB_PASSWORD" ]   || missing+=("  gh secret set SUPABASE_DB_PASSWORD")
          [ -n "$PROJECT_REF" ]            || missing+=("  gh variable set SUPABASE_PROJECT_REF")
          [ -n "$PS_ADMIN_TOKEN" ]         || missing+=("  gh secret set POWERSYNC_ADMIN_TOKEN")
          [ -n "$POWERSYNC_INSTANCE_ID" ]  || missing+=("  gh variable set POWERSYNC_INSTANCE_ID")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::deploy is not configured — ${#missing[@]} item(s) missing."
            echo "Configure exactly these, then re-run (see docs/release.md §4):"
            printf '%s\n' "${missing[@]}"
            exit 1
          fi
          echo "✓ credentials present · target project: $PROJECT_REF"

      - name: 1 · Link the project
        run: supabase link --project-ref "$PROJECT_REF"

      # Idempotent: db push applies only migrations the project has not seen.
      # This runs BEFORE the function deploy and before any app release, for
      # the reason cloud-setup §3b spells out — a client writing a column the
      # cloud schema lacks gets PGRST204, and PowerSync then retries the failed
      # upload forever, wedging sync entirely rather than failing one row.
      - name: 2 · Push migrations (supabase db push)
        run: supabase db push

      # Functions ship separately from the schema; `db push` never touches them.
      # Both import doors, by name: `functions deploy` with no argument would
      # ship whatever happens to be in the folder, and the two are named here so
      # adding a third is a deliberate line in this file rather than a surprise
      # in a deploy.
      - name: 3 · Deploy the import edge functions
        run: |
          supabase functions deploy import-recipe
          supabase functions deploy import-receipt

      # The committed streams YAML is the source of truth for what devices are
      # allowed to sync; a schema deploy without a matching streams deploy is
      # how a table silently never reaches a phone (the 2026-09-01 outage in
      # the header). Validate first so a shape mismatch fails the run before
      # anything is touched. Pinned, not latest: local and CI move together.
      - name: 4 · Deploy PowerSync sync streams
        run: |
          # Only the sync config: `validate` otherwise also checks the service
          # schema and the replication connections, which read a service.yaml
          # this repo deliberately does not carry (powersync/README.md).
          npx --yes powersync@0.10.0 validate \
            --validate-only sync-config \
            --instance-id "$POWERSYNC_INSTANCE_ID" \
            --sync-config-file-path docker/powersync-cloud.streams.yaml
          npx --yes powersync@0.10.0 deploy sync-config \
            --instance-id "$POWERSYNC_INSTANCE_ID" \
            --sync-config-file-path docker/powersync-cloud.streams.yaml

      # Opt-in: reseed the TEMPLATE vocabulary (cloud-setup §2). Same order as
      # the runbook; seed_usda only when the reference table is empty (its
      # 8,204 rows are plain inserts and never change between releases).
      - name: 5 · Reseed the template vocabulary (opt-in)
        if: ${{ inputs.reseed_template }}
        run: |
          # Strict: the step branches on this count, so an unreadable value
          # stops it here (scripts/db_query_value.sh asks for JSON by name).
          usda="$(scripts/db_query_value.sh 'select count(*) from usda_food')"
          echo "usda_food rows: $usda"
          # The template household and its whole curated vocabulary, generated
          # from supabase/seed/snapshot.jsonl.
          supabase db query --linked -f supabase/seed_vocab.sql
          if [ "$usda" = "0" ]; then
            supabase db query --linked -f supabase/seed_usda.sql
          else
            echo "usda_food already populated — skipping seed_usda.sql"
          fi
          # Unconditional, and after seed_usda: the BM25 index is derived from
          # usda_food, so it is stale the moment those rows change — and on the
          # empty-table path the migration built it over nothing, which makes
          # usda_probe raise "usda_search index is empty" and kills the USDA
          # sheet. A sub-second truncate+rebuild is cheaper than reasoning about
          # whether this run needed it. Same order config.toml documents.
          supabase db query --linked -f supabase/seed_usda_index.sql
          # Tolerant: the seed has landed and nothing branches on this number,
          # so an unreadable one is logged, not fatal.
          tmpl="$(scripts/db_query_value.sh "select count(*) from ingredient where household_id='00000000-0000-0000-0000-0000000000aa' and deleted_at is null" || true)"
          echo "template: ${tmpl:-unreadable — see the diagnosis above} live ingredients (seed/counts.json says $(jq -r .ingredients supabase/seed/counts.json))"

      # The deploy is only half the story whenever a change also altered the
      # curated vocabulary. Nothing here can safely do that leg, so it ends by
      # saying so out loud instead of leaving cloud half-migrated in silence.
      - name: Reminder — seed + rollout legs are human-run
        run: |
          {
            echo "### deploy-supabase finished"
            echo
            echo "Applied to \`$PROJECT_REF\`: **migrations** (\`db push\`), the"
            echo "**import-recipe** and **import-receipt** functions, and the **PowerSync sync streams**"
            echo "(\`docker/powersync-cloud.streams.yaml\` → instance \`$POWERSYNC_INSTANCE_ID\`)."
            echo
            echo "**Not applied — do these by hand if this deploy included"
            echo "seed-affecting changes:**"
            echo
            if [ "${{ inputs.reseed_template }}" = "true" ]; then
              echo "- **cloud-setup §2 — template reseed: DONE on this run** (step 5)."
            else
              echo "- **cloud-setup §2 — reseed the template vocab.** Not ticked on"
              echo "  this run: re-dispatch with \`reseed_template\` if \`supabase/seed/**\`"
              echo "  or \`supabase/seed_vocab.sql\` changed."
            fi
            echo "- **cloud-setup §2b — roll reseeded \`ingredient\` columns onto"
            echo "  existing households.** A reseed updates the TEMPLATE household;"
            echo "  households already onboarded keep their old clone until the §2b"
            echo "  rollout runs. Preview first (it reports the blast radius), then"
            echo "  run it, then re-run the preview: every leg should read 0."
            echo
            echo "Also human-run: \`supabase secrets set\` (§3b) and the"
            echo "dashboard-only checklist. Verify with \`scripts/cloud_verify.sh\`"
            echo "and record the run in the cloud-setup ledger."
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
