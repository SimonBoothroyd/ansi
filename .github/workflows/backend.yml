name: backend

on:
  push:
    paths: ["supabase/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["supabase/**", ".github/workflows/backend.yml"]

jobs:
  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Lint + test edge functions
        working-directory: supabase/functions
        run: |
          deno fmt --check
          deno lint
          deno task test

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local stack and apply migrations
        run: |
          supabase start
          supabase db lint
      - name: Verify migrations are idempotent on reset
        run: supabase db reset --no-seed
      - name: Database tests (pgTAP — RLS, constraints)
        run: supabase test db
