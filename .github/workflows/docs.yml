name: docs

# `docker/**` and the drift script are in the paths because check_docs.sh runs
# check_stream_drift.sh: the guard on the sync-rule security boundary has to
# fire on a change to the sync rules themselves, and nothing else triggers on
# them (backend.yml is supabase/**, app.yml is app/**).
on:
  push:
    paths: ["**/*.md", "docker/**", "scripts/check_docs.sh",
            "scripts/check_stream_drift.sh", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["**/*.md", "docker/**", "scripts/check_docs.sh",
            "scripts/check_stream_drift.sh", ".github/workflows/docs.yml"]

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true # a newer push supersedes this run

jobs:
  knowledge-base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check knowledge base integrity
        run: ./scripts/check_docs.sh
