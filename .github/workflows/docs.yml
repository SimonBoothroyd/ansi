name: docs

# `docker/**` and the drift script are in the paths because check_docs.sh runs
# check_stream_drift.sh: the guard on the sync-rule security boundary has to
# fire on a change to the sync rules themselves, and nothing else triggers on
# them (backend.yml is supabase/**, app.yml is app/**).
on:
  push:
    paths: ["**/*.md", "docker/**", "scripts/check_docs.sh",
            "scripts/check_stream_drift.sh", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["**/*.md", "docker/**", "scripts/check_docs.sh",
            "scripts/check_stream_drift.sh", ".github/workflows/docs.yml"]

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true # a newer push supersedes this run

jobs:
  knowledge-base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # check_docs.sh regenerates docs/generated/* to prove they are fresh, and
      # the unit-admission half is `dart run` inside app/, whose pub get needs
      # the Flutter SDK. Without it the generator fails and both files read as
      # stale whatever their content.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1' # exact — local and CI move together
          cache: true
      - run: flutter pub get
        working-directory: app
      - name: Check knowledge base integrity
        run: ./scripts/check_docs.sh
