name: docs

on:
  push:
    paths: ["**/*.md", "scripts/check_docs.sh", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["**/*.md", "scripts/check_docs.sh", ".github/workflows/docs.yml"]

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true # a newer push supersedes this run

jobs:
  knowledge-base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check knowledge base integrity
        run: ./scripts/check_docs.sh
