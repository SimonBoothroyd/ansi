name: evals

# The matching eval is a calibration tool (see import-and-matching.md §11),
# not a merge gate — it runs on demand and nightly, and reports drift.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true # a newer push supersedes this run

jobs:
  matching-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          # Pinned, not `v2.x`, and to the same version backend.yml pins: local
          # and CI move together, so a Deno release can never turn a green
          # working tree red on its own.
          deno-version: v2.9.5
      - name: Run matching eval
        working-directory: evals
        run: ./runner/run.sh
