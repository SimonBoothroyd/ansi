name: app

on:
  push:
    paths: ["app/**", "scripts/share_bundle*", "supabase/functions/share-recipe/share_page*", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**", "scripts/share_bundle*", "supabase/functions/share-recipe/share_page*", ".github/workflows/app.yml"]

defaults:
  run:
    working-directory: app

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true # a newer push supersedes this run

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1' # exact — local and CI move together (3.47.2's Dart adds a new analyze warning)
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      # Repo tests open a real PowerSyncDatabase on the runner: that needs the
      # core extension binary, and a SQLite built to load extensions (the
      # runner's libsqlite3.so is, macOS's system SQLite is not — see
      # app/test/helpers/test_db.dart).
      - name: PowerSync core extension
        run: |
          sudo apt-get update && sudo apt-get install -y libsqlite3-dev
          ../scripts/fetch_powersync_core.sh
      - run: dart format --set-exit-if-changed .
      - run: flutter analyze
      - run: dart run custom_lint
      - run: flutter test --coverage
      - name: Enforce domain purity (no Flutter imports in domain/units)
        run: |
          if grep -rEl "package:flutter/" lib/core/units lib/features/*/domain 2>/dev/null; then
            echo "::error::domain/units layer must be pure Dart (no package:flutter imports)"
            exit 1
          fi
      # A recipe's share page is this app's Dart compiled to JS, rendered by
      # the share-recipe edge function. Compiling it also holds the page free
      # of Flutter; the smoke run renders the test fixture in Deno, as the
      # function will; and the committed copy beside the function must be
      # what this commit's Dart compiles to.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5 # the version backend.yml pins
      - name: Share page bundle compiles, renders, and is committed fresh
        run: |
          ../scripts/share_bundle.sh
          git diff --exit-code -- ../supabase/functions/share-recipe/ || {
            echo "::error::the share page bundle is stale — run make share-bundle and commit supabase/functions/share-recipe/share_page*"
            exit 1
          }
      - uses: codecov/codecov-action@v4
        with:
          files: app/coverage/lcov.info
        continue-on-error: true
