# Minimal local config. `supabase init` will expand this; kept lean for the scaffold.
project_id = "mise"

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
# seed.sql = household + curated vocab; seed_usda.sql = the usda_food reference
# (server-side only). Order matters if the vocab prefill ever reads usda_food.
sql_paths = ["./seed.sql", "./seed_usda.sql", "./seed_prefill.sql"]

[auth]
enable_signup = true
# Google OAuth (ADR-0002) — configure the provider + secrets locally, not here.
# [auth.external.google]
# enabled = true

[api]
port = 54321
schemas = ["public"]

# PowerSync needs asymmetric JWTs + (for the demo pattern) anonymous sign-in.
# See the powersync-community/flutter-powersync-supabase starter.
# signing_keys_path = "./signing_keys.json"
