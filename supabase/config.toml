# Minimal local config. `supabase init` will expand this; kept lean for the scaffold.
project_id = "ansi"

[db]
port = 54322
# 17 = what the hosted project runs, and what a LINKED checkout already gets:
# once `supabase link` writes supabase/.temp/postgres-version (gitignored), the
# CLI uses that tag and ignores this line. CI never links, so CI fell back to
# this number — and it said 15, so CI was silently testing on Postgres 15.8
# while every developer machine ran 17.6. Keep this at the hosted major so the
# unlinked case (CI, a fresh clone) matches the linked one.
major_version = 17

[db.seed]
enabled = true
# Order matters: seed.sql (household + vocab) → seed_usda.sql (the server-only
# usda_food reference) → seed_prefill.sql (copies macros onto matched vocab
# rows) → seed_measures.sql (hand-curated starter measures on the vocab).
sql_paths = ["./seed.sql", "./seed_usda.sql", "./seed_prefill.sql", "./seed_measures.sql", "./seed_curation.sql"]

[auth]
enable_signup = true
# Deep-link back into the app after OAuth (Google) — the Flutter scheme.
site_url = "io.ansi.app://login-callback"
additional_redirect_urls = ["io.ansi.app://login-callback"]

# Dev auth (step 7): local email/password with no mail server, so skip the
# confirmation round-trip. Real deployments keep confirmations on.
[auth.email]
enable_confirmations = false

# Inject the caller's household_id into the JWT (public.add_household_claim,
# migration 0007) so PowerSync sync rules can scope buckets to the household.
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/add_household_claim"

# Google OAuth (ADR-0002) — code ships in step 7; verify against a real Google
# project at cloud cutover. Set the id/secret as env, never commit them.
# [auth.external.google]
# enabled = true
# client_id = "env(GOOGLE_CLIENT_ID)"
# secret = "env(GOOGLE_SECRET)"

[api]
port = 54321
schemas = ["public"]

# Edge functions. The import pipeline (step 8) is auth-scoped: the gateway
# verifies the caller's JWT before the function runs, so `import-recipe` can trust
# the `household_id` claim (the add_household_claim hook) it decodes from the
# token. The ANTHROPIC_API_KEY it needs is passed at serve time via --env-file
# (the gitignored .env.local) — never committed. See supabase/functions/import-recipe.
[functions.import-recipe]
enabled = true
verify_jwt = true

# PowerSync needs asymmetric JWTs + (for the demo pattern) anonymous sign-in.
# See the powersync-community/flutter-powersync-supabase starter.
# signing_keys_path = "./signing_keys.json"
